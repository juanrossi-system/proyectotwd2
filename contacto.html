<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contacto - The Walking Dead</title>
  <link rel="stylesheet" href="../css/estilos.css">
</head>
<body>

<header>
  <h1>CONTACTO</h1>
  <p>Sumate a la comunidad o dejanos tu mensaje</p>
</header>

<nav>
  <a href="index.html">Inicio</a>
  <a href="personajes.html">Personajes y actores</a>
  <a href="temporadas.html">Temporadas</a>
  <a href="capitulosiconicos.html">Capítulos Icónicos</a>
  <a href="hechos-lugares.html">Hechos de la Serie</a>
  <a href="contacto.html" class="activo">Contacto</a>
</nav>

<main>
  <form action="confirmacion.html" method="GET" class="form-contacto">
    <div class="campo-grupo">
      <label for="nombre">Nombre:</label>
      <input type="text" id="nombre" name="nombre" required minlength="2" placeholder="Tu nombre">
    </div>

    <div class="campo-grupo">
      <label for="apellido">Apellido:</label>
      <input type="text" id="apellido" name="apellido" required minlength="2" placeholder="Tu apellido">
    </div>

    <div class="campo-grupo">
      <label for="email">Correo Electrónico:</label>
      <input type="email" id="email" name="email" required placeholder="ejemplo@correo.com">
    </div>

    <div class="campo-grupo">
      <label for="mensaje">Mensaje:</label>
      <textarea id="mensaje" name="mensaje" rows="5" required minlength="10" placeholder="Escribe tu mensaje aquí..."></textarea>
    </div>

    <button type="submit" class="btn-enviar">Enviar Mensaje</button>
  </form>
</main>

<footer>
  <a href="index.html">Volver al inicio</a>
</footer>

</body>
</html>
